name: Tapped Out iOS 27

on:
  push:
    branches:
      - temp/tapped-out-offline-profile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout workbench
        uses: actions/checkout@v4

      - name: Probe current Project Springfield distribution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://teamtsto.org/ -o teamtsto.html
          python3 - <<'PY'
          import html, re
          text = html.unescape(open('teamtsto.html', encoding='utf-8', errors='ignore').read())
          text = text.replace('\\/', '/').replace('\\u002F', '/').replace('\\u003A', ':')
          urls = sorted(set(re.findall(r'https?://[^"\'<>\\s]+', text)))
          print('=== Project Springfield URL candidates ===')
          for u in urls:
              if any(k in u.lower() for k in ('.ipa', 'pjtsto', 'springfield', 'tsto.live', 'cdn')):
                  print(u[:500])
          PY
          echo '=== endpoint probes ==='
          for u in 'https://test.pjtsto.com/' 'https://cdn.projectspringfield.com/static/'; do
            code=$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 "$u" || true)
            echo "$u -> HTTP $code"
          done

      - name: Fetch preservation patcher and 4.69.5 IPA
        run: |
          git clone --depth 1 https://github.com/bodnjenie14/Tsto_patcher.git upstream-tsto
          test -f "upstream-tsto/Original Files/tsto_original.ipa"
          cp "upstream-tsto/Original Files/tsto_original.ipa" input-4.69.5.ipa
          shasum -a 256 input-4.69.5.ipa | tee input-sha256.txt

      - name: Verify source IPA for iPhone 16 / iOS 27
        run: |
          python3 tapped-out/tools/inspect_ipa.py input-4.69.5.ipa | tee source-verification.txt

      - name: Scan 4.69.5 account and currency markers
        run: |
          python3 tapped-out/tools/scan_4695_markers.py input-4.69.5.ipa --json marker-report.json | tee marker-report.txt

      - name: Patch client to Project Springfield endpoints
        working-directory: upstream-tsto
        run: |
          python3 - <<'PY'
          import sys, types

          class ConsoleMessageBox:
              @staticmethod
              def showinfo(title, message): print(f"[INFO] {title}: {message}")
              @staticmethod
              def showerror(title, message): raise RuntimeError(f"{title}: {message}")
              @staticmethod
              def showwarning(title, message): print(f"[WARN] {title}: {message}")
              @staticmethod
              def askyesno(title, message): return True

          tkinter = types.ModuleType("tkinter")
          tkinter.messagebox = ConsoleMessageBox
          sys.modules["tkinter"] = tkinter

          from modules.ios import run_ipa_script

          run_ipa_script(
              "Original Files/tsto_original.ipa",
              "https://test.pjtsto.com/",
              "https://cdn.projectspringfield.com/static/",
              "com.ea.simpsonssocial.inc2",
              "Tapped Out",
              "4.69.5",
              None,
              print,
          )
          PY
          test -f Tapped_Out.ipa
          cp Tapped_Out.ipa ../project-springfield-4.69.5.ipa

      - name: Prepare unsigned iOS 27 IPA
        run: |
          python3 tapped-out/ios27/prepare_latest_ipa.py \
            project-springfield-4.69.5.ipa \
            Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa | tee prepare-log.txt

      - name: Fix legacy iOS disk-space guard
        run: |
          set -euo pipefail
          python3 tapped-out/tools/patch_ios27_diskcheck.py \
            Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa \
            Tapped-Out-4.69.5-iPhone16-iOS27-diskfix.ipa | tee diskfix-log.txt
          mv Tapped-Out-4.69.5-iPhone16-iOS27-diskfix.ipa Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa

      - name: Embed offline premium profile contract
        run: |
          python3 - <<'PY'
          import plistlib, tempfile, zipfile
          from pathlib import Path

          ipa = Path('Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa')
          profile = Path('tapped-out/profile/offline-profile.json').read_bytes()
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              with zipfile.ZipFile(ipa, 'r') as zf:
                  zf.extractall(root)
              apps = list((root / 'Payload').glob('*.app'))
              assert len(apps) == 1, apps
              app = apps[0]
              (app / 'OfflinePremiumProfile.json').write_bytes(profile)
              info_path = app / 'Info.plist'
              info = plistlib.loads(info_path.read_bytes())
              info['NVOfflineProfileResource'] = 'OfflinePremiumProfile.json'
              plistlib.dump(info, info_path.open('wb'), fmt=plistlib.FMT_BINARY, sort_keys=False)
              out = ipa.with_suffix('.tmp.ipa')
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():
                          zf.write(p, p.relative_to(root).as_posix())
              out.replace(ipa)
          PY

      - name: Verify final IPA and disk fix
        run: |
          set -euo pipefail
          python3 tapped-out/tools/inspect_ipa.py Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa | tee final-verification.txt
          unzip -tq Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa
          unzip -l Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa | grep OfflinePremiumProfile.json
          python3 - <<'PY'
          import plistlib, zipfile
          ipa='Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa'
          with zipfile.ZipFile(ipa) as z:
              info_name=[n for n in z.namelist() if n.startswith('Payload/') and n.count('/') == 2 and n.endswith('.app/Info.plist')][0]
              info=plistlib.loads(z.read(info_name))
              exe=info_name.rsplit('/',1)[0]+'/'+info['CFBundleExecutable']
              blob=z.read(exe)
          got=blob[0x18190:0x18198]
          expected=bytes.fromhex('20008052c0035fd6')
          print('disk fix bytes:', got.hex())
          if got != expected:
              raise SystemExit('disk-space patch verification failed')
          PY
          shasum -a 256 Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa | tee final-sha256.txt

      - name: Upload IPA and reports
        uses: actions/upload-artifact@v4
        with:
          name: Tapped-Out-4.69.5-iPhone16-iOS27-fixed
          if-no-files-found: error
          retention-days: 30
          path: |
            Tapped-Out-4.69.5-iPhone16-iOS27-unsigned.ipa
            input-sha256.txt
            source-verification.txt
            marker-report.json
            marker-report.txt
            prepare-log.txt
            diskfix-log.txt
            final-verification.txt
            final-sha256.txt
            teamtsto.html

name: Diagnose Blurrr clean executable diff

on:
  push:
    branches:
      - temp/minimal-vip-networktest-20260902

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download public Blurrr source
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://github.com/apptesters-org/AppTesters_Repo/releases/download/23-04-2026/Blurrr_2.3.56_Premium_%40thisismanpreets_apptesters.org.ipa' \
            -o source.ipa
      - name: Compare executable 1MiB CRC32 blocks to clean upload
        run: |
          rm -rf work && mkdir work
          unzip -q source.ipa -d work
          python - <<'PY'
          import glob, plistlib, zlib, hashlib
          from pathlib import Path
          expected = 'dd49617d 49aba97e 04b00de6 ad77cf01 54d736a7 0001732e f733d3c7 2fe3fb7e d3d67038 60fe0285 28af5329 db5ba56c 1c68cd05 e154ccf2 ae1fc4e1 863e2819 f93c34d3 5419d853 7b08dea6 34e4c155 6b73acca 1da4bbc7 c37df136 cdb98efd be46ba14 1a74b8c1 5047d03d 975a18bd f0e31e95 02b12431 5b74a4fe 19ddda98 5729e929 f22c6630 6ef9e189 9b7bcb79 2a52e2c0 2e41407e 16ab32a3 2e2723e3 923619b7 97129159 cfa23bff 02fda607 71e95f2e af2053ef 2d8bd65f 0f4c1924 cb0cf987 deef36c2 cdddab76 ac4a66e5 75a6923a a7f9196b 8ac17972 49130009 c458f66b 9ec7da2b f09c0748 4f22903e 4b12aee5 1f57dfdd e8163c92 d2ac00fd 947261de 00802a2a 0e5dfbed f8083b19 5fc0d97f e51d1cc5 a0b0f1f4 97a4dd98 055c6a73 627694b0 f188c59a 0c8c8fae 35dd2543 3ea3efb4 9b695ba0 e55fe66f 474d6e24 8d91dc45 efc1bece 20da1bcf 869b32b3 5569f3d4 877c89bb a2eb66fa 2f6fd1c7'.split()
          app = Path(glob.glob('work/Payload/*.app')[0])
          info = plistlib.loads((app/'Info.plist').read_bytes())
          exe = app / info['CFBundleExecutable']
          data = exe.read_bytes()
          chunk = 1024*1024
          actual=[f'{zlib.crc32(data[i:i+chunk]) & 0xffffffff:08x}' for i in range(0,len(data),chunk)]
          print('PUBLIC_EXEC_SHA256', hashlib.sha256(data).hexdigest())
          print('PUBLIC_EXEC_SIZE', len(data))
          print('CLEAN_EXEC_SHA256', '02ca122adc543cf0601cf02385900f6546acb47dbf4ef7e6633f4a3152000836')
          print('CLEAN_EXEC_SIZE', 93024720)
          mismatches=[]
          for i,(a,e) in enumerate(zip(actual,expected)):
              if a != e:
                  mismatches.append(i)
                  print('MISMATCH', i, 'public='+a, 'clean='+e)
          if len(actual) != len(expected):
              print('CHUNK_COUNT_MISMATCH', len(actual), len(expected))
          print('MISMATCH_INDICES', ','.join(map(str,mismatches)))
          print('MISMATCH_COUNT', len(mismatches))
          PY
name: Publish Blurrr 2.3.56 temp release

on:
  push:
    branches:
      - temp/offline-premium-profile-20260902

permissions:
  contents: write

concurrency:
  group: blurrr-offline-premium-2.3.56-temp
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Blurrr offline premium IPA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: temp/offline-premium-profile-20260902

      - name: Download Blurrr 2.3.56 source IPA
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://github.com/apptesters-org/AppTesters_Repo/releases/download/23-04-2026/Blurrr_2.3.56_Premium_%40thisismanpreets_apptesters.org.ipa' \
            -o Blurrr-2.3.56-source.ipa
          ls -lh Blurrr-2.3.56-source.ipa
          sha256sum Blurrr-2.3.56-source.ipa

      - name: Verify Blurrr identity and version
        run: |
          python - <<'PY'
          import hashlib
          import plistlib
          import zipfile
          from pathlib import Path

          ipa = Path('Blurrr-2.3.56-source.ipa')
          h = hashlib.sha256()
          with ipa.open('rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(chunk)
          print('Downloaded IPA SHA-256:', h.hexdigest())
          print('Reference uploaded IPA SHA-256: 968a5b3dba2c70773ffe3f552740207cf23248141f790b2cb216bf1588e1869b')

          with zipfile.ZipFile(ipa) as archive:
              plist_path = next(
                  name for name in archive.namelist()
                  if name.startswith('Payload/') and name.endswith('.app/Info.plist')
              )
              info = plistlib.loads(archive.read(plist_path))
              bundle = info.get('CFBundleIdentifier')
              version = info.get('CFBundleShortVersionString')
              build = str(info.get('CFBundleVersion'))
              print('Verified:', bundle, version, build)
              if bundle != 'com.pinguo.msgAries':
                  raise SystemExit(f'Unexpected bundle id: {bundle}')
              if version != '2.3.56':
                  raise SystemExit(f'Unexpected version: {version}')
              if build != '2356':
                  raise SystemExit(f'Unexpected build: {build}')
          PY

      - name: Unpack and inspect Juice metadata
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q Blurrr-2.3.56-source.ipa -d work
          EXECUTABLE=$(python - <<'PY'
          import glob, plistlib
          from pathlib import Path
          app = Path(glob.glob('work/Payload/*.app')[0])
          with open(app / 'Info.plist', 'rb') as stream:
              info = plistlib.load(stream)
          print(app / info['CFBundleExecutable'])
          PY
          )
          echo "EXECUTABLE=$EXECUTABLE" >> "$GITHUB_ENV"
          file "$EXECUTABLE"
          echo '=== Juice strings/selectors ==='
          strings -a -t x "$EXECUTABLE" | grep -i -E 'juice|balanceJuice|blurrr.?juice' | head -n 400 || true
          if ! command -v llvm-objdump >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq llvm >/dev/null
          fi
          echo "llvm-objdump=$(command -v llvm-objdump)"
          llvm-objdump --macho --objc-meta-data "$EXECUTABLE" > /tmp/blurrr-objc.txt 2>&1 || true
          echo '=== Objective-C metadata around Juice ==='
          grep -in -B 15 -A 30 -E 'balanceJuice|juice' /tmp/blurrr-objc.txt | head -n 800 || true

      - name: Apply and verify hardcoded offline premium profile
        run: |
          set -euo pipefail
          echo "Patching $EXECUTABLE"
          python blurrr-offline-premium/patch.py "$EXECUTABLE"
          find work/Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          rm -f work/Payload/*.app/embedded.mobileprovision || true
          (cd work && zip -qry ../BlurrrPremium-2.3.56-unsigned.ipa .)
          unzip -tq BlurrrPremium-2.3.56-unsigned.ipa
          sha256sum BlurrrPremium-2.3.56-unsigned.ipa | tee BlurrrPremium-2.3.56-unsigned.sha256
          ls -lh BlurrrPremium-2.3.56-unsigned.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: blurrr-offline-premium-2.3.56-temp
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            BlurrrPremium-2.3.56-unsigned.ipa \
            BlurrrPremium-2.3.56-unsigned.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Blurrr 2.3.56 Offline Premium (Temp)" \
            --notes "Unsigned Blurrr 2.3.56 temp test build from temp/offline-premium-profile-20260902. Pro entitlement gates are hardcoded locally. Juice metadata inspection is included in CI while the 999999 balance patch is being mapped. Sign before installation."

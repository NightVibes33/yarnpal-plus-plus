name: Publish Blurrr 2.3.56 temp release

on:
  push:
    branches:
      - temp/offline-premium-profile-20260902

permissions:
  contents: write

concurrency:
  group: blurrr-offline-premium-2.3.56-temp
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Blurrr offline premium IPA
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: temp/offline-premium-profile-20260902

      - name: Download exact source used by first working build
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://github.com/apptesters-org/AppTesters_Repo/releases/download/23-04-2026/Blurrr_2.3.56_Premium_%40thisismanpreets_apptesters.org.ipa' \
            -o Blurrr-2.3.56-source.ipa
          echo 'daeaf19e85746e3b3cbe6357c1399dfe0210a929783b2f8906d2104df5163335  Blurrr-2.3.56-source.ipa' | sha256sum -c -

      - name: Verify Blurrr identity and version
        run: |
          python - <<'PY'
          import plistlib, zipfile
          from pathlib import Path
          ipa = Path('Blurrr-2.3.56-source.ipa')
          with zipfile.ZipFile(ipa) as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'Corrupt IPA entry: {bad}')
              plist_path = next(name for name in archive.namelist() if name.startswith('Payload/') and name.endswith('.app/Info.plist'))
              info = plistlib.loads(archive.read(plist_path))
              bundle = info.get('CFBundleIdentifier')
              version = info.get('CFBundleShortVersionString')
              build = str(info.get('CFBundleVersion'))
              print('Verified:', bundle, version, build)
              if (bundle, version, build) != ('com.pinguo.msgAries', '2.3.56', '2356'):
                  raise SystemExit(f'Unexpected Blurrr identity: {(bundle, version, build)}')
          PY

      - name: Apply exact first-working Pro-only patch
        run: |
          set -euo pipefail
          rm -rf work
          mkdir work
          unzip -q Blurrr-2.3.56-source.ipa -d work
          EXECUTABLE=$(python - <<'PY'
          import glob, plistlib
          from pathlib import Path
          app = Path(glob.glob('work/Payload/*.app')[0])
          with open(app / 'Info.plist', 'rb') as stream:
              info = plistlib.load(stream)
          print(app / info['CFBundleExecutable'])
          PY
          )
          python blurrr-offline-premium/patch.py "$EXECUTABLE"
          ACTUAL_EXEC_SHA=$(sha256sum "$EXECUTABLE" | awk '{print $1}')
          EXPECTED_EXEC_SHA='f7670fcb26bc4b11c5827cd32e7874e2f3109a7b388dfd5423a16ae5e7917065'
          echo "Patched executable SHA-256: $ACTUAL_EXEC_SHA"
          test "$ACTUAL_EXEC_SHA" = "$EXPECTED_EXEC_SHA"
          find work/Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          rm -f work/Payload/*.app/embedded.mobileprovision || true
          (cd work && zip -qry ../BlurrrPremium-2.3.56-unsigned.ipa .)
          unzip -tq BlurrrPremium-2.3.56-unsigned.ipa
          sha256sum BlurrrPremium-2.3.56-unsigned.ipa | tee BlurrrPremium-2.3.56-unsigned.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: blurrr-offline-premium-2.3.56-temp
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            BlurrrPremium-2.3.56-unsigned.ipa \
            BlurrrPremium-2.3.56-unsigned.sha256 \
            --target "${GITHUB_SHA}" \
            --title "Blurrr 2.3.56 Offline Premium (First Working Build)" \
            --notes "Fully reverted to the first working Pro-only Blurrr patch. No Juice modifications are present. The source IPA and patched executable SHA-256 are pinned to the exact values from the original successful run #7. Sign before installation."

name: Publish Blurrr temp release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-blurrr-temp-release.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: temp/offline-premium-profile-20260902
          fetch-depth: 0

      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Download exact Blurrr 2.3.56 source IPA
        run: |
          cat > /tmp/get_ipa.py <<'PY'
          import re
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          URL='https://ipauniverse.com/com.pinguo.msgAries'
          OUT=Path('Blurrr-2.3.56-source.ipa')
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(accept_downloads=True)
              page=context.new_page()
              captured=[]
              def on_response(resp):
                  u=resp.url
                  ct=(resp.headers.get('content-type') or '').lower()
                  cd=(resp.headers.get('content-disposition') or '').lower()
                  if '.ipa' in u.lower() or 'application/octet-stream' in ct or '.ipa' in cd:
                      captured.append(u)
              page.on('response', on_response)
              page.goto(URL, wait_until='domcontentloaded', timeout=120000)
              page.wait_for_timeout(8000)
              links=page.locator('a').evaluate_all("els => els.map(a => ({href:a.href,text:(a.innerText||a.textContent||'').trim()}))")
              candidates=[]
              for x in links:
                  h=x.get('href') or ''; t=x.get('text') or ''
                  if '.ipa' in h.lower() or 'download' in h.lower() or re.search(r'download|ipa',t,re.I): candidates.append((h,t))
              print('candidates:', candidates)
              for h,t in candidates:
                  if not h or h.startswith('javascript:'): continue
                  try:
                      r=context.request.get(h, timeout=120000, max_redirects=10)
                      b=r.body()
                      if len(b)>50_000_000 and b[:2]==b'PK':
                          OUT.write_bytes(b); print('direct',h,len(b)); browser.close(); raise SystemExit(0)
                  except SystemExit: raise
                  except Exception as e: print('direct failed',h,e)
              for sel in ["a:has-text('Download')","button:has-text('Download')","text=/Download IPA/i","text=/Download/i"]:
                  loc=page.locator(sel)
                  for i in range(min(loc.count(),10)):
                      try:
                          with page.expect_download(timeout=30000) as info: loc.nth(i).click(timeout=10000)
                          dl=info.value; dl.save_as(str(OUT))
                          if OUT.exists() and OUT.stat().st_size>50_000_000:
                              print('browser',dl.suggested_filename,OUT.stat().st_size); browser.close(); raise SystemExit(0)
                      except SystemExit: raise
                      except Exception as e: print('click failed',sel,i,e)
              for h in captured:
                  try:
                      r=context.request.get(h, timeout=120000, max_redirects=10); b=r.body()
                      if len(b)>50_000_000 and b[:2]==b'PK':
                          OUT.write_bytes(b); print('captured',h,len(b)); browser.close(); raise SystemExit(0)
                  except SystemExit: raise
                  except Exception as e: print('captured failed',h,e)
              page.screenshot(path='ipauniverse-debug.png',full_page=True)
              Path('ipauniverse-debug.html').write_text(page.content(),encoding='utf-8')
              browser.close(); raise SystemExit('Could not resolve IPA download')
          PY
          python /tmp/get_ipa.py

      - name: Verify, patch and package
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,plistlib,zipfile
          from pathlib import Path
          p=Path('Blurrr-2.3.56-source.ipa')
          expected='968a5b3dba2c70773ffe3f552740207cf23248141f790b2cb216bf1588e1869b'
          got=hashlib.sha256(p.read_bytes()).hexdigest(); print('source sha256',got)
          if got!=expected: raise SystemExit(f'hash mismatch expected {expected} got {got}')
          with zipfile.ZipFile(p) as z:
              n=next(n for n in z.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist'))
              i=plistlib.loads(z.read(n)); print(i.get('CFBundleIdentifier'),i.get('CFBundleShortVersionString'),i.get('CFBundleVersion'))
              assert i.get('CFBundleIdentifier')=='com.pinguo.msgAries'
              assert i.get('CFBundleShortVersionString')=='2.3.56'
          PY
          rm -rf work && mkdir work
          unzip -q Blurrr-2.3.56-source.ipa -d work
          EXECUTABLE=$(python - <<'PY'
          import glob,plistlib
          from pathlib import Path
          app=Path(glob.glob('work/Payload/*.app')[0])
          info=plistlib.load(open(app/'Info.plist','rb'))
          print(app/info['CFBundleExecutable'])
          PY
          )
          python blurrr-offline-premium/patch.py "$EXECUTABLE"
          find work/Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          rm -f work/Payload/*.app/embedded.mobileprovision || true
          (cd work && zip -qry ../BlurrrPremium-2.3.56-unsigned.ipa .)
          unzip -tq BlurrrPremium-2.3.56-unsigned.ipa
          sha256sum BlurrrPremium-2.3.56-unsigned.ipa | tee BlurrrPremium-2.3.56-unsigned.sha256

      - name: Publish release asset from temp branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: blurrr-offline-premium-2.3.56-temp
        run: |
          set -euo pipefail
          TARGET_SHA=$(git rev-parse HEAD)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" BlurrrPremium-2.3.56-unsigned.ipa BlurrrPremium-2.3.56-unsigned.sha256 --target "$TARGET_SHA" --title "Blurrr 2.3.56 Offline Premium (Temp)" --notes "Unsigned temp test build from temp/offline-premium-profile-20260902. Sign before installation."
